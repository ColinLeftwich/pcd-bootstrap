---
- name: Bootstrap Desktop
  hosts: localhost
  become: true
  vars:
    ansible_connection: local
    ansible_python_interpreter: auto_silent
    ssh_key_filename: id_ed25519
  
  pre_tasks:
  - name: Install kewlfft.aur collection
    ansible.builtin.command:
      cmd: ansible-galaxy collection install kewlfft.aur
    delegate_to: localhost
    run_once: true
    changed_when: false

  tasks:
    - name: Update System
      pacman:
        update_cache: yes
        upgrade: yes

    - name: Enable and Start Bluetooth
      service:
        name: bluetooth
        enabled: yes
        state: started

    - name: Enable and Start libvirt
      service:
        name: libvirtd.socket
        enabled: yes
        state: started

    - name: Install Core Packages
      package:
        name:
          - vim
          - ranger
          - curl
          - tmux
          - nvtop
          - git
          - yay
          - htop
          - zsh
          - starship
          - net-tools
          - rsync
          - stow
          - zoxide
          - fzf
          - jq
          - bat
          - eza
          - git-delta
          - terraform
          - github-cli
        state: present

    - name: Software Dev Packages
      package:
        name:
          - zed
          - neovim
          - alacritty
          - just
          - jre21-openjdk
          - python-poetry
          - python-pytest
          - ruff
          - pyright
          - ansible-lint
          - libvirt
          - qemu-full
          - virt-manager
          - dnsmasq
        state: present

    - name: Media Packages
      package:
        name:
          - obs-studio
          - blender
          - audacity
          - krita
          - inkscape
          - steam
        state: present

    - name: Productivity
      package:
        name:
          - obsidian
          - flameshot
          - filelight
          - scrcpy
        state: present

    - name: Engineering Packages
      package:
        name:
          - kicad
          - kicad-library
          - kicad-library-3d
          - verilator
          - klayout
          - wireshark-cli
          - wireshark-qt
        state: present

    - name: Install AUR Packages
      kewlfft.aur.aur:
        name:
          - mprocs
          - lazydocker
          - anki-bijn
          - nmap
          - fd
          - ulauncher
          - imhex-bin
          - ttf-meslo-nerd-font-powerlevel10k
        state: present
        use: yay
      become: yes
      become_user: "colin"

    - name: Generate ssh key "{{ssh_key_filename}}"
      openssh_keypair:
        path: "~/.ssh/{{ssh_key_filename}}"
        type: ed25519
        state: present
        force: no

    - name: Ensure default shell is zsh 
      user:
        name: colin
        shell: /bin/zsh

    - name: Create Project directories
      file:
        path: /home/colin/Projects
        state: directory
        owner: colin
        group: colin
        mode: '0755'